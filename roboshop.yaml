- name : we create a ec2 instance
  hosts: localhost
  connection: local
  vars:
    instances: ["mongo","redis","mysql","rabitmq","frontend","catalog","user","cart","shipping","payment"]
    action: created
    domain_name: saikrishna-lab.online
    ami_id: ami-0055977a6e828a4f4

  tasks:
    - name: To create a ec2 instances 
      amazon.aws.ec2_instance:
        name : "roboshop-{{item}}"
        image_id: "{{ami_id}}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{item}}"
        region: us-east-1
      loop: "{{instances}}"
      when: action == "created"
      register: ec2_output  # registry is used to read the output data of above module

#using below we know the output of the above ec2-output
    - name: print ec2-output
      debug:
        msg: "{{ec2_output}}"
    
  #Create route53 records 

    - name: create/add route53 record for privateip
      amazon.aws.route53:
        state: present
        zone: "{{domain_name}}"
        record: "{{item.item}}.{{domain_name}}"
        type: A
        ttl: 1
        value: "{{item.instances[0].private_ip_address}}"
        overwrite: true
      loop: "{{ec2_output.results}}"
      when: action == "created"

    - name: create/add route53 record for public ip for frontend
      amazon.aws.route53:
        state: present
        zone: "{{domain_name}}"
        record: "{{domain_name}}"
        type: A
        ttl: 1
        value: "{{item.instances[0].public_ip_address}}"
        overwrite: true
      loop: "{{ec2_output.results}}"
      when: action == "created" and item.item == "frontend"
    
    - name: Show processed instance names
      debug:
        msg: "{{ ec2_output.results | map(attribute='item') | list }}"
    
  # Delete route 53 records  
    
    - name: delete route 53 record
      amazon.aws.route53:
        state: absent
        zone: "{{domain_name}}"
        record: "{{item}}.{{domain_name}}"
        ttl: 1
        type: A
      loop: "{{instances}}"
      when: action == "delete"
  
  # Delete route 53 records  from frontend

    - name: delete route 53 record
      amazon.aws.route53:
        state: absent
        zone: "{{domain_name}}"
        record: "{{domain_name}}"
        ttl: 1
        type: A
      when: action == "delete" 
  # Delete EC2 instances
     
    - name: delete EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{item}}"
        region: us-east-1
        wait: false
      loop: "{{instances}}"
      when: action == "delete"
      