
    - name: Disable nginx
      command: dnf module disable nginx -y

    - name: enable nginx
      command: dnf module enable nginx:1.26 -y

    - name: install nginx
      dnf:
       name: nginx 
       state: present

    - name: Create nginx web directory
      file:
       path: /usr/share/nginx/html
       state: directory
  
    - name: Find existing HTML contents
      find:
        paths: /usr/share/nginx/html
        recurse: true
        hidden: true
        file_type: any
      register: html_contents

    - name: Remove existing HTML contents
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ html_contents.files }}"

    - name: remove existing data
      file:
        path: /tmp/frontend.zip
        state: absent
    
    - name: download the file from the url
      get_url:
         url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
         dest: /tmp/frontend.zip
    
    - name: Extract local zip file to remote server
      unarchive:
        src: /tmp/frontend.zip
        dest: /usr/share/nginx/html
        remote_src: yes

    - name: copy the file 
      template:
        src: roboshop.conf.j2
        dest: /etc/nginx/default.d/roboshop.conf
      notify: restart nginx

    - name: Validate nginx configuration
      command: nginx -t
      changed_when: false