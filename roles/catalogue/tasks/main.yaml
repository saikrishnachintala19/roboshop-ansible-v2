- name: print the varibales
  debug:
    msg: "print the current leaning is {{ learning }}"
    
- name: application setup
  include_role: 
     name: common
     tasks_from: app-setup

- name: nodejs setup
  include_role:
     name: common
     tasks_from: nodejs
    
- name: systemd setup
  include_role: 
      name: common
      tasks_from: systemd-setup

- name: restart setup
  include_role: 
      name: common
      tasks_from: restart
    
- name: Copy mongo.repo to remote host
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongodb-org package
  dnf:
    name: mongodb-mongosh
    state: present
  
- name: To check wethere data is alredy loaded or not 
  command: mongosh --host {{mongodb_host}} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: command_output

- name: Print the command_ouput
  debug:
    msg: "print the out put {{command_output}}"

- name: load the data
  shell: mongosh --host {{mongodb_host}} </app/db/master-data.js
  when: command_output.stdout | int == 0




          