    
    - name: print the varibales
      debug:
        msg: "print the current leaning is {{ learning }}"
    
    - name: application setup
      include_role: 
         name: common
         tasks_from: app-setup

    - name: java setup
      include_role:
        name: common
        tasks_from: java
    
    - name: systemd setup
      include_role: 
        name: common
        tasks_from: systemd-setup

    - name: find java25 path
      shell: readlink -f /usr/lib/jvm/java-25-openjdk*/bin/java | head -1
      register: java25

    - name: print the output of java25
      debug:
       msg: "print the output {{java25}}"

    - name: direclty set the java25
      command: alternatives --set java {{java25.stdout}}
    
    - name: perminent set the java25
      copy:
        content: "export JAVA_HOME= {{java25.stdout | dirname | dirname }}"
        dest: /etc/profile.d/java.sh

    - name: restart setup
      include_role: 
        name: common
        tasks_from: restart