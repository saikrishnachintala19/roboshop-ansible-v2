  - name : enable mysql version
    command: dnf module enable mysql:8.4 -y
  - name: install mysql
    package:
      name: mysql-server
      state: present
      use: dnf
  - name: enable and start mysql
    service:
      name: mysqld
      state: started
      enabled: true

  - name: setup root password
    command: mysql_secure_installation --set-root-pass "{{mysql_root_password}}"